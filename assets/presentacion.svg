<svg xmlns="http://www.w3.org/2000/svg" width="500" height="56" viewBox="0 0 500 56" role="img" aria-labelledby="title desc">
<title id="title">Ingeniero electrónico</title><desc id="desc">IoT, web y videojuegos. Creativo, adaptable y curioso.</desc>
<style>@media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}</style>
<rect width="500" height="56" rx="8" fill="#161b22"/>
<defs><clipPath id="type"><rect width="500" height="56"><animate class="motion" attributeName="width" values="0;500;500;0;0" keyTimes="0;0.4;0.88;0.98;1" dur="6s" repeatCount="indefinite"/></rect></clipPath></defs>
<g fill="#ff8296" font-family="monospace" font-size="24" text-anchor="middle">
<g class="motion" clip-path="url(#type)">
<text x="250" y="36" opacity="1">Ingeniero electrónico<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.32;0.3333;1" dur="18s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="250" y="36" opacity="0">IoT · Web · Videojuegos<animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.3333;0.6667;1" dur="18s" repeatCount="indefinite" calcMode="discrete"/></text>
<text x="250" y="36" opacity="0">Creativo, adaptable y curioso<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3333;0.6667;1" dur="18s" repeatCount="indefinite" calcMode="discrete"/></text>
</g>
<text class="still" display="none" x="250" y="36">Ingeniero electrónico</text>
</g></svg>
